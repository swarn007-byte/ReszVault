services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${RESZVAULT_DEMO_DB_NAME:-reszvault}
      POSTGRES_USER: ${RESZVAULT_DEMO_DB_USER:-reszvault}
      POSTGRES_PASSWORD: ${RESZVAULT_DEMO_DB_PASSWORD:-reszvault-demo}
    ports:
      - "127.0.0.1:${RESZVAULT_DEMO_DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15
  pgadmin:
    image: dpage/pgadmin4:9.14
    environment:
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: reszvault-demo
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
